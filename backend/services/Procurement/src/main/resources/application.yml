spring:
  application:
    name: procurement-service
  main:
    banner-mode: off
  autoconfigure:
    # PROC-009 removes the RabbitMQ exclusion when event publishing is added.
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    url: ${PROCUREMENT_DB_URL:jdbc:postgresql://localhost:5432/procurement_db}
    username: ${PROCUREMENT_DB_USERNAME:procurement}
    password: ${PROCUREMENT_DB_PASSWORD:procurement}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Procurement Service
    version: ${APP_VERSION:1.0-SNAPSHOT}
    environment: ${APP_ENVIRONMENT:local}
